# Local Postgres only — run Next.js + code-execution on the host (mock mode).
# Usage: docker compose -f docker-compose.postgres.yml up -d
services:
    postgres:
        container_name: daily-coding-challenges_postgres
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: daily_coding_challenge
            POSTGRES_PASSWORD: daily_coding_challenge
            POSTGRES_DB: daily_coding_challenge
        volumes:
            - daily_coding_challenges_pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U daily_coding_challenge -d daily_coding_challenge",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    daily_coding_challenges_pgdata:
