version: "3.8"

services:
    postgres:
        container_name: daily-coding-challenges_postgres
        image: postgres:16-alpine
        env_file: .env.docker
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - daily_coding_challenges_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    nextjs:
        container_name: daily-coding-challenges_nextjs
        build:
            context: .
            dockerfile: Dockerfile.nextjs
        ports:
            - "3000:3000"
        env_file:
            - .env.docker
        environment:
            DATABASE_URL: ${DATABASE_URL}
            CODE_EXECUTION_URL: ${CODE_EXECUTION_URL}
            APP_MODE: ${APP_MODE:-production}
        depends_on:
            postgres:
                condition: service_healthy
            code-execution:
                condition: service_started
        restart: unless-stopped

    code-execution:
        container_name: daily-coding-challenges_code_execution
        build:
            context: ./code-execution-server
            dockerfile: Dockerfile.code-execution
        ports:
            - "5000:5000"
        env_file:
            - .env.docker
        environment:
            EXECUTION_MODE: ${EXECUTION_MODE:-docker}
            PORT: 5000
        volumes:
            # Required when EXECUTION_MODE=docker so the executor can spawn language containers
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy

networks:
    default:
        driver: bridge

volumes:
    daily_coding_challenges_data:
